layout: default
title: "Z₂ Lattice Gauge Theory"

<h2>Z₂ Lattice Gauge Theory (Loop Model)</h2>

<div class="sim-container">
  <canvas id="lattice" width="400" height="400" style="border:1px solid #aaa;"></canvas>

  <div class="controls">
    <div>
      <label>System size L = <span id="Lval">NULL</span></label>
      <input type="range" id="Lslider" min="50" max="100" step="2">
    </div>

    <div>
      <label>Temperature T = <span id="Tval">NULL</span></label>
      <input type="range" id="Tslider" min="0.1" max="2" step="0.1">
    </div>

    <div>
      <label>Speed = <span id="Speedval">NULL</span></label>
      <input type="range" id="Speedslider" min="0.1" max="5" step="0.1">
    </div>

    <div>
        <button id="toggleBtn">⏸️ Pause</button>
    </div>

    <!-- <p>Energy per edge: <strong><span id="Edisp">0.00</span></strong></p> -->
  </div>
</div>

<p style="max-width:600px">
Edges represent Z₂ spins (thin = 0, thick = 1).  
Each Monte Carlo step flips all four edges around a random plaquette,  
accepted with probability exp(–ΔE/T).  
</p>

<script src="{{ '/assets/js/z2gauge.js' | relative_url }}"></script>
