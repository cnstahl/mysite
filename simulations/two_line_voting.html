<h2>GKL Rule IV</h2>

<div class="sim-container">
  <canvas id="lattice" width="400" height="400" style="border:1px solid #aaa;"></canvas>

  <div class="controls">
    <div>
      <label>System size L = <span id="Lval">NULL</span></label>
      <input type="range" id="Lslider" min="10" max="300" step="2">
    </div>

    <div>
      <label>Error rate p = <span id="Pval">NULL</span></label>
      <input type="range" id="Pslider" min="0.0" max="1" step="0.01">
    </div>

    <div>
      <label>Speed = <span id="Speedval">NULL</span></label>
      <input type="range" id="Speedslider" min="0.1" max="5" step="0.1">
    </div>

    <div>
        <button id="toggleBtn">⏸️ Pause</button>
        <button id="stepBtn">Step</button>
        <button id="flipBtn">Flip</button>
    </div>

    <div>
      <button id="resetBtn">🔄 Reset</button>
      <button id="yellowBtn">Yellow</button>
    </div>

    <!-- <p>Energy per edge: <strong><span id="Edisp">0.00</span></strong></p> -->
  </div>
</div>

<p style="max-width:600px">
The current state of the system is the bottom row, and higher 
rows are the history. Drag the sliders to change simulation parameters.
</p>

<script src="{{ '/assets/js/two_line.js' | relative_url }}"></script>
