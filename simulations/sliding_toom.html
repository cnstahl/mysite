---
layout: default
title: "Sliding Toom's rule"
---

<h2>Sliding Toom's rule</h2>

<div class="sim-container">
  <canvas id="lattice" width="400" height="400" style="border:1px solid #aaa;"></canvas>

  <div class="controls">
    <div>
      <label>System size L = <span id="Lval">NULL</span></label>
      <input type="range" id="Lslider" min="50" max="300" step="2">
    </div>

    <div>
      <label>Temperature T = <span id="Tval">NULL</span></label>
      <input type="range" id="Tslider" min="0.0" max="4" step="0.1">
    </div>

    <div>
      <label> Bias h = <span id="Hval">NULL</span></label>
      <input type="range" id="Hslider" min="-1" max="1" step="0.1">
    </div>

    <div>
      <label>Velocity V = <span id="Vval">NULL</span></label>
      <input type="range" id="Vslider" min="0" max="4" step="0.1">
    </div>

    <div>
      <label>Simulation speed = <span id="Speedval">NULL</span></label>
      <input type="range" id="Speedslider" min="0.1" max="5" step="0.1">
    </div>

    <!-- <div>
      <label>Simulation speed = <span id="Speedval">NULL</span></label>
      <input type="range" id="Speedslider" min="0.1" max="5" step="0.1">
    </div> -->

    <div>
        <button id="toggleBtn">⏸️ Pause</button>
        <button id="middleBtn">Flip</button>
        <button id="slideBtn">Slide</button>
        <button id="voteBtn">Vote</button>
    </div>

    <div>
      <button id="resetBtn">🔄 Reset</button>
    </div>

    <!-- <p>Energy per edge: <strong><span id="Edisp">0.00</span></strong></p> -->
  </div>
</div>

<p style="max-width:600px">
Generating erosion from translations and symmetric majority votes.
</p>

<script src="{{ '/assets/js/sliding_toom.js' | relative_url }}"></script>
